name: Build Desktop (Tauri)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macOS-Intel
          - platform: windows-latest
            args: ''
            label: Windows
          - platform: ubuntu-22.04
            args: ''
            label: Linux

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build core + web client
        run: |
          npm run build:core
          npm run build:client -w @klv/web

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'KLV v__VERSION__'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: klv-${{ matrix.label }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/**/*.deb
            packages/desktop/src-tauri/target/release/bundle/**/*.rpm
            packages/desktop/src-tauri/target/release/bundle/**/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/**/*.dmg
            packages/desktop/src-tauri/target/release/bundle/**/*.app
            packages/desktop/src-tauri/target/release/bundle/**/*.msi
            packages/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
