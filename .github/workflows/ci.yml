name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (build, typecheck, tests)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/web/client/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # core + cli (tsc) and web (Vite client build + nest build)
      - name: Build
        run: npm run build

      # Vite does not type-check the client
      - name: Type-check client
        run: npx tsc --noEmit -p packages/web/client

      - name: Test core (parser/query parity fixtures)
        run: npm test -w @klv/core

  rust:
    name: Rust (tests)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri::generate_context! needs the frontendDist folder to exist
      - name: Create frontend dist placeholder
        run: mkdir -p packages/web/client-dist

      # Runs the same parity fixtures as the core tests against the Rust parser and evaluator
      - name: Test
        working-directory: packages/desktop/src-tauri
        run: cargo test
