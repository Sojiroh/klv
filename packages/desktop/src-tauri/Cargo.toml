[package]
name = "klv-desktop"
version = "0.7.0"
edition = "2021"
description = "KLV — Kubernetes Log Viewer Desktop"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
kube = { version = "0.98", features = ["client", "runtime"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
futures = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
# 1.4.2 (DuckDB 1.4 LTS): las versiones posteriores dependen de `zip ^6`, cuyas versiones están retiradas de crates.io
duckdb = { version = "=1.4.2", features = ["bundled", "parquet"] }
# Solo para migrar la configuración del historial v1 (`history/legacy.rs`)
rusqlite = { version = "0.40", features = ["bundled"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "klv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
